<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Title — Denniel Estira</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --paper:#F7F6F3;
  --ink:#17181A;
  --muted:#7A7873;
  --line:#E1DFD8;
  --accent:#2F6F6B;
  --accent-soft:#E7EFEE;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{
  --paper:#141412;
  --ink:#F3F1EC;
  --muted:#9A968C;
  --line:#2A2924;
  --accent:#7FC4BD;
  --accent-soft:#1D2A28;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}

h1,.serif{
  font-family:'Fraunces',Georgia,serif;
  font-weight:500;
  letter-spacing:-0.01em;
}

a{
  color:inherit;
  text-decoration:none;
}

::selection{
  background:var(--accent);
  color:var(--paper);
}

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}


/* =========================
   BUTTONS
========================= */

.back-btn{
  position:fixed;
  top:20px;
  left:24px;
  z-index:10;

  display:inline-flex;
  align-items:center;
  gap:8px;

  background:var(--paper);
  border:1px solid var(--line);
  padding:9px 16px;
  border-radius:100px;

  cursor:pointer;
  font-family:inherit;
  font-size:.85rem;
  color:var(--ink);
}

.theme-toggle{
  position:fixed;
  top:20px;
  right:24px;
  z-index:10;

  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);

  width:36px;
  height:36px;
  border-radius:100px;

  cursor:pointer;
  font-size:.9rem;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================
   MAIN
========================= */

.detail-inner{
  max-width:760px;
  margin:0 auto;
  padding:100px 28px 100px;
}


/* =========================
   IMAGE SLIDESHOW
========================= */

.detail-slideshow{
  position:relative;
  width:100%;
  margin-bottom:36px;
}

.slide-container{
  position:relative;
  width:100%;
  aspect-ratio:16/9;

  overflow:hidden;
  border-radius:6px;

  background:var(--accent-soft);
  border:1px solid var(--line);
}

.slide-container img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* Previous / Next buttons */

.slide-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);

  width:42px;
  height:42px;

  border-radius:50%;
  border:1px solid rgba(255,255,255,.6);

  background:rgba(0,0,0,.45);
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  font-size:20px;
  line-height:1;

  transition:
    background .2s ease,
    transform .2s ease;
}

.slide-btn:hover{
  background:rgba(0,0,0,.7);
}

.slide-btn:active{
  transform:translateY(-50%) scale(.95);
}

.slide-prev{
  left:14px;
}

.slide-next{
  right:14px;
}


/* Image counter */

.slide-counter{
  position:absolute;
  right:14px;
  bottom:14px;

  background:rgba(0,0,0,.55);
  color:white;

  padding:5px 10px;
  border-radius:100px;

  font-size:.75rem;
}


/* Dots */

.slide-dots{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:7px;

  margin-top:14px;
}

.slide-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  border:0;
  padding:0;

  background:var(--line);

  cursor:pointer;

  transition:
    width .2s ease,
    background .2s ease;
}

.slide-dot.active{
  width:22px;
  border-radius:100px;
  background:var(--accent);
}


/* =========================
   PROJECT INFO
========================= */

.detail-meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0 20px;
}

.detail-meta span{
  font-size:.8rem;
  color:var(--muted);

  border:1px solid var(--line);

  padding:4px 12px;
  border-radius:100px;
}

.detail-inner h1{
  font-size:clamp(1.5rem, 3.2vw, 2.1rem);
  line-height:1.2;              /* tight lines for headings (was inheriting 1.6) */
  letter-spacing:-0.005em;
  margin-bottom:24px;

  text-wrap:balance;            /* evens out line lengths, no lonely last word */
  overflow-wrap:anywhere;       /* stops very long words from overflowing */
  hyphens:auto;
}

/* Extra shrink for very long titles (class added by JS) */
.detail-inner h1.long-title{
  font-size:clamp(1.25rem, 2.6vw, 1.6rem);
  line-height:1.25;
  letter-spacing:0;
}

.detail-body p{
  color:var(--muted);
  margin-bottom:16px;
  max-width:62ch;
}

.detail-links{
  display:flex;
  gap:14px;
  margin-top:30px;
}

.detail-links a{
  border:1px solid var(--ink);
  padding:10px 22px;
  font-size:.85rem;
  border-radius:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .detail-inner{
    padding:90px 20px 80px;
  }

  .back-btn{
    top:14px;
    left:16px;
  }

  .theme-toggle{
    top:14px;
    right:16px;
  }

  .slide-container{
    aspect-ratio:4/3;
  }

  .slide-btn{
    width:36px;
    height:36px;
    font-size:17px;
  }

  .slide-prev{
    left:10px;
  }

  .slide-next{
    right:10px;
  }

}

</style>
</head>

<body>

<a class="back-btn" href="index.html#projects">
  ← Back
</a>

<button
  class="theme-toggle"
  id="themeToggle"
  aria-label="Toggle dark mode">
  ☾
</button>


<div class="detail-inner" id="detailRoot">


  <!-- =========================
       IMAGE SLIDESHOW
  ========================== -->

  <div class="detail-slideshow">

    <div class="slide-container">

      <img
        id="d-img"
        src=""
        alt=""
      >

      <!-- Previous -->
      <button
        class="slide-btn slide-prev"
        id="prevBtn"
        aria-label="Previous image">
        ‹
      </button>

      <!-- Next -->
      <button
        class="slide-btn slide-next"
        id="nextBtn"
        aria-label="Next image">
        ›
      </button>

      <!-- Counter -->
      <div
        class="slide-counter"
        id="slideCounter">
        1 / 1
      </div>

    </div>


    <!-- Dots -->
    <div
      class="slide-dots"
      id="slideDots">
    </div>

  </div>


  <!-- =========================
       PROJECT INFORMATION
  ========================== -->

  <div
    class="detail-meta"
    id="d-meta">
  </div>

  <h1
    class="serif"
    id="d-title">
  </h1>

  <div
    class="detail-body"
    id="d-body">
  </div>

  <div
    class="detail-links"
    id="d-links">
  </div>

</div>


<script src="./data.js"></script>


<script>

  // =========================
  // PROJECT DATA
  // =========================

  const params = new URLSearchParams(location.search);

  const type = params.get("type");
  const id = params.get("id");

  const source =
    type === "figma"
      ? figma
      : projects;

  const item =
    source.find(x => x.id === id);


  // =========================
  // SLIDESHOW VARIABLES
  // =========================

  let currentImage = 0;


  if (item) {

    document.title =
      item.title + " — Denniel Estira";


    // =========================
    // IMAGE SLIDESHOW
    // =========================

    const image = document.getElementById("d-img");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const counter =
      document.getElementById("slideCounter");

    const dots =
      document.getElementById("slideDots");


    // Show image
    function showImage(index){

      currentImage = index;

      image.src =
        item.images[currentImage];

      image.alt =
        item.title +
        " - Image " +
        (currentImage + 1);


      // Counter

      counter.textContent =
        (currentImage + 1) +
        " / " +
        item.images.length;


      // Update dots

      document
        .querySelectorAll(".slide-dot")
        .forEach((dot, i) => {

          dot.classList.toggle(
            "active",
            i === currentImage
          );

        });

    }


    // =========================
    // CREATE DOTS
    // =========================

    dots.innerHTML =
      item.images
        .map((img, index) => `
          <button
            class="slide-dot ${index === 0 ? "active" : ""}"
            aria-label="Go to image ${index + 1}"
            data-index="${index}">
          </button>
        `)
        .join("");


    // Dot click

    document
      .querySelectorAll(".slide-dot")
      .forEach(dot => {

        dot.addEventListener(
          "click",
          function(){

            showImage(
              Number(this.dataset.index)
            );

          }
        );

      });


    // =========================
    // NEXT BUTTON
    // =========================

    nextBtn.addEventListener(
      "click",
      function(){

        const next =
          (currentImage + 1) %
          item.images.length;

        showImage(next);

      }
    );


    // =========================
    // PREVIOUS BUTTON
    // =========================

    prevBtn.addEventListener(
      "click",
      function(){

        const previous =
          (currentImage - 1 +
            item.images.length) %
          item.images.length;

        showImage(previous);

      }
    );


    // Start slideshow

    showImage(0);


    // Hide controls if only one image

    if (item.images.length <= 1) {

      prevBtn.style.display = "none";
      nextBtn.style.display = "none";
      dots.style.display = "none";
      counter.style.display = "none";

    }


    // =========================
    // TAGS
    // =========================

    document.getElementById("d-meta").innerHTML =
      item.tag
        .split("·")
        .map(t =>
          `<span>${t.trim()}</span>`
        )
        .join("");


    // =========================
    // TITLE
    // =========================

    const titleEl =
      document.getElementById("d-title");

    titleEl.textContent = item.title;

    // Long titles get a smaller size
    if (item.title.length > 60) {

      titleEl.classList.add("long-title");

    }


    // =========================
    // DESCRIPTION
    // =========================

    document.getElementById("d-body")
      .innerHTML =
        item.body
          .map(p => `<p>${p}</p>`)
          .join("");


    // =========================
    // LINKS
    // =========================

    const linksEl =
      document.getElementById("d-links");


    if (item.link) {

      linksEl.innerHTML = `
        <a
          href="${item.link}"
          target="_blank"
          rel="noopener">
          Open in Figma ↗
        </a>
      `;

    } else {

      linksEl.remove();

    }


    // =========================
    // BACK BUTTON
    // =========================

    document.querySelector(".back-btn").href =
      type === "figma"
        ? "index.html#figma"
        : "index.html#projects";


  } else {

    document.getElementById("detailRoot")
      .innerHTML =
        "<p>Item not found.</p>";

  }


  // =========================
  // DARK / LIGHT MODE
  // =========================

  const themeBtn =
    document.getElementById("themeToggle");


  function applyTheme(theme){

    document.documentElement
      .setAttribute(
        "data-theme",
        theme
      );


    themeBtn.textContent =
      theme === "dark"
        ? "☀"
        : "☾";


    localStorage.setItem(
      "theme",
      theme
    );

  }


  const savedTheme =
    localStorage.getItem("theme");


  if (savedTheme){

    applyTheme(savedTheme);

  } else {

    const prefersDark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

    applyTheme(
      prefersDark
        ? "dark"
        : "light"
    );

  }


  // Toggle theme

  themeBtn.addEventListener(
    "click",
    function(){

      const currentTheme =
        document.documentElement
          .getAttribute("data-theme");

      const newTheme =
        currentTheme === "dark"
          ? "light"
          : "dark";

      applyTheme(newTheme);

    }
  );

</script>

</body>
</html>
